title: Philip Lambok
author: Philip Lambok
description: 
url: "https://philiplambok.github.io"
baseurl: ""

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

minima:
  skin: dark

# Silence deprecation warnings coming from minima's stylesheets.
sass:
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions]

# Old articles live in archive/ and are only readable on GitHub.
exclude:
  - archive
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - mise.toml
  - Gemfile
  - Gemfile.lock
  - vendor
